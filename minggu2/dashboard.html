<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Pedro Store</title>
<!-- Tailwind CSS 4 (Play CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!-- Layout grid: 3 baris (header, isi, footer) x 5 kolom (sidebar 1/5 = 20%, konten 4/5 = 80%) -->
<body class="min-h-screen grid grid-rows-[auto_1fr_auto] grid-cols-5 bg-slate-50 text-slate-800">

  <!-- Posisi 1: Header (logo kiri, logout kanan) -->
  <header class="col-span-5 flex items-center justify-between px-8 py-4 bg-emerald-900">
    <a href="dashboard.html" class="flex items-center gap-3">
      <span class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg>
      </span>
      <span class="text-2xl font-extrabold text-white">Pedro Store</span>
    </a>
    <a href="index.html" class="px-4 py-2 rounded-lg bg-white/10 text-white text-sm font-semibold hover:bg-red-600">Logout</a>
  </header>

  <!-- Posisi 2a: Sidebar navigasi (20%) -->
  <aside class="col-span-1 bg-white border-r border-slate-200 p-4">
    <p class="px-3 mb-2 text-xs font-semibold uppercase text-slate-400">Menu</p>
    <nav class="flex flex-col gap-1 text-sm font-medium">
      <a href="dashboard.html" class="px-3 py-2.5 rounded-lg bg-emerald-50 text-emerald-700">Dashboard</a>
      <a href="products.html" class="px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100">Products</a>
      <a href="users.html" class="px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100">Users</a>
      <a href="setting.html" class="px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100">Setting</a>
    </nav>
  </aside>

  <!-- Posisi 2b: Konten utama (80%) -->
  <main class="col-span-4 min-w-0 p-8">
    <h1 class="text-3xl font-bold text-slate-900">Ringkasan</h1>
    <p class="text-slate-500 mt-1 mb-6">Ringkasan statistik toko Anda</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
      <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0">
          <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        </div>
        <div>
          <p class="text-2xl font-bold">Rp 186.400.000</p>
          <p class="text-sm text-slate-500">Total penjualan</p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center shrink-0">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2l1.5 3h9L18 2"/><path d="M3 6h18l-2 13H5L3 6z"/></svg>
        </div>
        <div>
          <p class="text-2xl font-bold">1.284</p>
          <p class="text-sm text-slate-500">Total order</p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-violet-50 flex items-center justify-center shrink-0">
          <svg class="w-6 h-6 text-violet-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 7v10l8 4 8-4V7"/></svg>
        </div>
        <div>
          <p class="text-2xl font-bold">356</p>
          <p class="text-sm text-slate-500">Total produk</p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center shrink-0">
          <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M18 8v6M21 11h-6"/></svg>
        </div>
        <div>
          <p class="text-2xl font-bold">87</p>
          <p class="text-sm text-slate-500">Pelanggan baru</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Posisi 3: Footer (copyright di tengah) -->
  <footer class="col-span-5 py-4 text-center text-sm text-white bg-slate-600">
    &copy; 2026 Pedro Store. All rights reserved.
  </footer>

</body>
</html>
